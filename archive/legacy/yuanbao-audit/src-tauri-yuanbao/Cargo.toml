[package]
name = "yuanbao-audit"
version = "0.1.0"
description = "DeepSeek Studio 桌面客户端（独立 Tauri 壳 + Node sidecar + 本地控制 API）"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
