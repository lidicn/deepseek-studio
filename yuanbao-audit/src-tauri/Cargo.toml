[package]
name = "yuanbao-audit"
version = "0.1.0"
description = "元宝审计桌面壳：Tauri WebView 打开元宝网页 + 注入自启动监控脚本"
authors = ["lidicn"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
