<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Studio · MCP 设置</title>
  <link rel="stylesheet" href="/mcp-settings.css" />
</head>
<body>
  <!--
    卡 C（MCP 独立原生窗口）页面壳 —— **零秘密**：
      - 不内嵌 token，也不留 `__STUDIO_TOKEN__` 占位符等服务端替换
        （那是 /agent 的模式；本页响应体必须与磁盘文件逐字节相同，服务端绝不做替换）。
      - token / origin 由 Rust init script 注入本窗：
        `window.__STUDIO_TOKEN__`（全权宿主 token）与 `window.__STUDIO_API_ORIGIN__`。
      - 数据面：`fetch` + 该 token 做鉴权，只打 `/v1/mcp/servers*`；
        秘密面仍落在统一鉴权闸 + 回环 Origin 闸之内；壳拿不到 token 就什么都读不到。
    资源同源相对路径引用（/mcp-settings.js 由宿主路由服务，实际文件是 dist/mcp-settings-panel.js）。
  -->
  <main id="mcp-root" class="mcp-settings-root"></main>
  <script src="/mcp-settings.js"></script>
</body>
</html>
