<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- P2：手机端可用。viewport-fit=cover 适配刘海屏；user-scalable=no 避免双击缩放干扰输入。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4D6BFE" />
  <!-- P2：PWA manifest。scope 限制在 /agent，不把整个域都变成 PWA。 -->
  <link rel="manifest" href="/agent.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/agent-icon-192.png" />
  <link rel="apple-touch-icon" href="/agent-icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Studio" />
  <title>DeepSeek Studio · 远程控制</title>
  <link rel="stylesheet" href="/agent.css" />
  <!-- P2：Service Worker 只缓存静态壳；/agent HTML 含令牌，SW 内显式 network-only。 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/agent-sw.js').catch(function () {
          /* SW 不可用（http 非安全上下文等）时静默降级，不影响面板功能 */
        });
      });
    }
  </script>
</head>
<body>
  <script>window.__STUDIO_TOKEN__ = "__STUDIO_API_TOKEN__";</script>

  <div id="app">
    <!-- 顶栏：品牌 / 工作区 / 权限档位 / 连接状态 / Focus 入口（降级提示） -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">DS</span>
        <span class="brand-name">Studio 远程控制</span>
      </div>

      <div class="workspace" id="workspace-box" title="打开的目录即智能体的权限边界">
        <span class="ws-icon">📁</span>
        <span class="ws-path" id="ws-path">未选择工作区</span>
        <button class="btn btn-ghost" id="btn-open-folder">打开文件夹</button>
      </div>

      <div class="policy-switch" id="policy-switch" title="权限档位：随时切换，立即生效">
        <button class="seg" data-mode="workspace"><span class="dot dot-green"></span>仅工作区</button>
        <button class="seg active" data-mode="auto"><span class="dot dot-yellow"></span>风险审批</button>
        <button class="seg" data-mode="full"><span class="dot dot-red"></span>完全放开</button>
      </div>

      <div class="connection" id="conn" title="模型引擎连接状态">
        <span class="conn-dot" id="conn-dot"></span>
        <span class="conn-text" id="conn-text">连接中…</span>
      </div>

      <button class="btn btn-ghost theme-toggle" id="btn-theme" type="button"
              aria-label="切换深浅主题" title="切换深浅主题">🌗</button>
      <button class="btn btn-ghost inspector-toggle" id="btn-inspector" type="button"
              aria-controls="inspector-drawer" aria-expanded="false">工具</button>
    </header>

    <!-- 三栏布局：左 rail / 左面板 / 中栏画布 / 右 Inspector / 窄屏抽屉 -->
    <main class="workbench-layout" id="studio-workbench-root">
      <aside class="left-rail" aria-label="导航栏"></aside>

      <section class="left-panel" aria-label="会话列表">
        <div class="pane-body session-list" id="session-list"></div>
      </section>

      <section class="center-canvas" id="center-canvas" aria-label="对话流">
        <div class="mobile-session-bar">
          <label for="session-select">会话</label>
          <select id="session-select" aria-label="选择电脑端执行会话"></select>
        </div>
        <div class="pane-body canvas-body"></div>
      </section>

      <aside class="right-inspector" id="right-inspector" aria-label="工具运行">
        <div class="pane-body inspector-body"></div>
      </aside>

      <aside class="inspector-drawer" id="inspector-drawer" aria-label="工具运行抽屉" aria-hidden="true">
        <div class="drawer-header">
          <span class="drawer-title">工具运行</span>
          <button class="btn btn-ghost" id="btn-drawer-close" type="button" aria-label="关闭工具抽屉">✕</button>
        </div>
        <div class="pane-body inspector-body"></div>
      </aside>
    </main>

    <!-- 输入区 -->
    <footer class="composer">
      <textarea id="input" rows="2" placeholder="远程发送任务…（由电脑端 DeepSeek 页面执行）"></textarea>
      <div class="composer-actions">
        <span class="hint" id="hint"></span>
        <button class="btn btn-danger hidden" id="btn-stop" type="button">■ 停止</button>
        <button class="btn btn-primary" id="btn-send" type="button">发送</button>
      </div>
    </footer>

    <!-- 状态条 -->
    <footer class="statusbar" id="statusbar" role="status" aria-live="polite"></footer>
  </div>

  <script src="/agent.js?v=20261020w2"></script>
</body>
</html>
