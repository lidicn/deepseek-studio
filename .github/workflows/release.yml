# 自动更新发版流（Tauri v2 updater + GitHub Releases）
#
# 触发面**刻意收窄**：只有推 `v*` tag 才跑（Gate 判据 1）。
# push main / PR 一律不触发 —— 防止未签名产物覆盖 `latest.json`。
#
# 秘密卫生（Gate 判据 2）：
#   - 私钥与密码**只从 GitHub Secrets 读**：TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   - 本文件不得出现任何私钥路径或内容。
#
# fail-safe 顺序（Gate 判据 4）：先建 **draft** Release 并上传安装包+签名+latest.json，
#   由人工点「Publish」后才生效 —— 失败只留 draft，不会留下半成品的公开更新源。
#
# ── P1-2 修复（Verify 0.14.4 真机确证：latest.json 的 url 自 0.14.0 起就是死链）────────────
# 根因：本地 NSIS/MSI 产物名带空格（`productName "DeepSeek++ Studio"`），上传后 GitHub 把
#       资产名的空格规范成点，compose 却用本地文件名拼 url → 客户端下载 404。
# 修法（选「改名」而不是「productName 去空格」，因为后者会动安装目录/快捷方式/卸载键谱系）：
#   ① 构建后把 nsis/msi 两个目录的产物（含 .sig）空格改点，**本地名 = GitHub 名 = url 三者一字不差**；
#   ② url 从**最终产物名**回填，且断言产物名里没有空格；
#   ③ 新增 G 闸（Gate 增补判据 G1-G6，见各步注释）：draft 建好后按 **GitHub 实际资产名**核对、
#      用**已上传的资产字节**校验签名与 pubkey 配对，签名不通过就删 draft（fail-closed）。
#   注：`.sig` 签的是**安装包字节**，不是 latest.json（tauri-plugin-updater-2.13.3/src/updater.rs:837-843），
#       所以改 url 不需要重签；但上传的字节必须与 signature 配对 —— 这正是 G2 拦的事故类。
name: Release

on:
  push:
    tags:
      - 'v*'

# 同一 tag 重复推只跑一次，不并发覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本一致性：tag 必须等于 package.json / tauri.conf.json 的 version（Gate 判据 3：版本号不许手写）
      - name: Verify tag matches version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tag package=$pkg tauri=$conf"
          if ($tag -ne $pkg -or $tag -ne $conf) {
            Write-Error "tag/version mismatch: tag=$tag package.json=$pkg tauri.conf.json=$conf"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 本仓用 npm（package-lock.json），不是 pnpm —— 首跑失败根因即 pnpm 无锁文件
      - name: Install deps
        run: npm ci

      # bundled node.exe 被 .gitignore 排除，CI 全新环境必须先取——tauri CLI 校验 bundle.resources 早于 beforeBuildCommand
      - name: Fetch bundled node
        run: node src-tauri/fetch-node.mjs

      # v0.14.12 诊断件（#43）：签名 Secrets 前置检查——空值 5 秒内自报，不烧 338 秒再抛看不懂的错。
      # GitHub Actions 里 secret 未配时 ${{ secrets.X }} 渲染成空串（PS7 $env:X='' 仍"存在且为空"），
      # tauri 拿到空串后走 decode 分支、在 Finished 2 bundles 之后才报
      # "failed to decode secret key: …Missing comment in secret key"——本步把诊断提到构建之前。
      # 判据：只报"哪个变量为空/其长度"，绝不打印值、绝不打印前缀字符。
      - name: Verify signing secrets present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vars = @{
            'TAURI_SIGNING_PRIVATE_KEY'          = $env:TAURI_SIGNING_PRIVATE_KEY
            'TAURI_SIGNING_PRIVATE_KEY_PASSWORD' = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          }
          foreach ($name in $vars.Keys) {
            $val = $vars[$name]
            if ([string]::IsNullOrWhiteSpace($val)) {
              Write-Error "Signing secret '${name}' is empty or not injected (length=$($val.Length)). A known cause of 'failed to decode secret key' after Finished 2 bundles."
              exit 1
            }
            Write-Host "[signing-check] ${name}: present, length=$($val.Length)"
          }
          # 诊断行（不含秘密）：runner OS / ref / 三向版本号 / bundle.targets / 缓存目录是否存在
          Write-Host "[signing-check] runner=$env:RUNNER_OS ref=$env:GITHUB_REF_NAME"
          Write-Host "[signing-check] pkg=$((Get-Content package.json -Raw | ConvertFrom-Json).version) tauri=$((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version)"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          Write-Host "[signing-check] bundle.targets=$($conf.bundle.targets -join ',')"
          $wixExists = Test-Path 'src-tauri/target/release/wix'
          $nsisExists = Test-Path 'src-tauri/target/release/nsis'
          Write-Host "[signing-check] wix_cached=$wixExists nsis_cached=$nsisExists"

      # ── v0.14.13 卡 E：打包工具预取＋退避（#47 复盘：run 42468047633 attempt=1 挂在 NSIS 下载 HTTP 504）──
      # 工具缓存在 %LOCALAPPDATA%\tauri\（runner 上＝C:\Users\runneradmin\AppData\Local\tauri）：
      #   NSIS\Bin\makensis.exe ＋ WixTools314\candle.exe。三步编排：恢复缓存 → 预取缺失（重试退避）→ 硬断言。
      # 断言步看真实文件、不看 cache 步自己的 hit/miss（命中空目录照样绿是坑）；预取与缓存互补不二选一。
      # URL 出处（台账口径）：NSIS＝PM-LOG.md:L1895（引 CI 日志 L651）；WiX＝CI run 42468047633
      #   job 128772059929 attempt=2 构建步 L643（在线读数，非本地落盘）。
      - name: Restore tauri packaging tools cache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-tools-nsis-3.11-wix314

      - name: Fetch missing tauri packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tauri = 'C:\Users\runneradmin\AppData\Local\tauri'
          $targets = @(
            @{ name='NSIS'; marker=Join-Path $tauri 'NSIS\Bin\makensis.exe'; url='https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip'; dest=$tauri; minBytes=1500000 },
            @{ name='WiX';  marker=Join-Path $tauri 'WixTools314\candle.exe';  url='https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip'; dest=(Join-Path $tauri 'WixTools314'); minBytes=30000000 }
          )
          # 退避策略（发版链加固 20261110）：5xx/429/网关瞬时错可重试、4xx(除429)不可重试。
          # 尝试 5 次、指数退避 10/20/40/80 秒（总等待上限 150s≈2.5min），抗 GitHub releases CDN
          # 偶发 504（v0.14.12 attempt=1 NSIS 504、v0.14.13 第三次同族失败，旧版仅 3 次×15s 总等待）。
          # minBytes 阈值取实测值 60%–73%（实测 2026-11-10：nsis-3.11.zip＝2,361,546 B／
          #   wix314-binaries.zip＝41,282,726 B；阈值用于拦截断流与 HTML 错误页，不误杀正常包）。
          $maxAttempts = 5
          $backoffSecs = @(10, 20, 40, 80)
          function Test-Retryable([int]$code) {
            return ($code -ge 500) -or ($code -eq 429)
          }
          foreach ($t in $targets) {
            if (Test-Path $t.marker) { Write-Host "[tools] $($t.name) present: $($t.marker)"; continue }
            Write-Host "[tools] $($t.name) missing -> fetching $($t.url)"
            $zip = Join-Path $env:RUNNER_TEMP "$($t.name)-tools.zip"
            $ok = $false
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Invoke-WebRequest -Uri $t.url -OutFile $zip -MaximumRedirection 5 -ErrorAction Stop
                $size = (Get-Item $zip).Length
                Write-Host "[tools] $($t.name) attempt $attempt: downloaded $size B"
                if ($size -lt $t.minBytes) {
                  Write-Host "[tools] $($t.name) attempt $attempt: package too small ($size < $($t.minBytes) min) — discarding, will retry"
                  Remove-Item $zip -Force -ErrorAction SilentlyContinue
                  throw "downloaded package size $size below minimum $($t.minBytes)"
                }
                # R-1（路径错配修复）：zip 顶层目录名可能与 marker 父目录名不同（如 nsis-3.11 vs NSIS；
                #   此处仅为说明性举例、不是逻辑前提——推导/查找/搬运三段不依赖任何包名字面量），
                # 不能直接解压到 marker 父目录——解压到临时区、按 marker 尾相对路径定位最浅满足层、再搬运。
                # 逐层 for 保证"最浅先"、同层歧义（>1）显式 throw 不猜、深度上限 2 层。
                # 不依赖任何 zip 实测布局：NSIS 在 depth1 命中、WiX 在 depth0 命中，两包走同一段代码。
                $tmpExtract = Join-Path $env:RUNNER_TEMP "$($t.name)-extract"
                if (Test-Path $tmpExtract) { Remove-Item $tmpExtract -Recurse -Force }
                Expand-Archive -Path $zip -DestinationPath $tmpExtract -Force
                $dstParent = Split-Path $t.marker -Parent
                $rel = $t.marker.Substring($dstParent.Length + 1)   # 'Bin\makensis.exe' ／ 'candle.exe'
                $root = $null; $depthHit = -1
                $level = @($tmpExtract)                              # depth 0
                for ($d = 0; $d -le 2; $d++) {                       # 最多下探 2 层、逐层收敛
                  $cand = @($level | Where-Object { Test-Path (Join-Path $_ $rel) })
                  if ($cand.Count -eq 1) { $root = $cand[0]; $depthHit = $d; break }
                  if ($cand.Count -gt 1) { throw "[$($t.name)] ambiguous layout: $($cand.Count) dirs at depth $d satisfy '$rel' — refusing to guess" }
                  $level = @($level | ForEach-Object { Get-ChildItem $_ -Directory -Force } | ForEach-Object { $_.FullName })
                  if ($level.Count -eq 0) { break }
                }
                if (-not $root) { throw "[$($t.name)] layout unmatched: no dir within depth 2 satisfies '$rel' from $($t.marker)" }
                if (-not (Test-Path $dstParent)) { New-Item -ItemType Directory -Force -Path $dstParent | Out-Null }
                Get-ChildItem $root -Force | Move-Item -Destination $dstParent -Force
                Write-Host "[tools] $($t.name) relocated from depth=$depthHit -> $dstParent"
                if (-not (Test-Path $t.marker)) {
                  Write-Host "[tools] $($t.name) attempt $attempt: marker still missing after relocate — discarding, will retry"
                  Remove-Item $zip -Force -ErrorAction SilentlyContinue
                  throw "$($t.name) archive relocated but marker still missing: $($t.marker)"
                }
                $ok = $true
                break
              } catch {
                $code = $null
                if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
                $msg = $_.Exception.Message
                Write-Host "[tools] $($t.name) attempt $attempt/$maxAttempts failed: HTTP=$code msg=$msg"
                if ($code -and -not (Test-Retryable $code)) {
                  throw "[$($t.name)] HTTP $code is not retryable (4xx except 429) — aborting after attempt $attempt from $($t.url)"
                }
                if ($attempt -lt $maxAttempts) {
                  $wait = $backoffSecs[$attempt - 1]
                  Write-Host "[tools] $($t.name) backing off ${wait}s before attempt $($attempt + 1)"
                  Start-Sleep -Seconds $wait
                }
              }
            }
            if (-not $ok) { throw "failed to download $($t.name) after $maxAttempts attempts from $($t.url) (HTTP gateway errors like 504 are the known failure mode; total backoff waited=$(($backoffSecs | Measure-Object -Sum).Sum)s)" }
            Write-Host "[tools] $($t.name) fetched and verified"
          }

      - name: Assert packaging tools present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          foreach ($p in @('C:\Users\runneradmin\AppData\Local\tauri\NSIS\Bin\makensis.exe', 'C:\Users\runneradmin\AppData\Local\tauri\WixTools314\candle.exe')) {
            if (-not (Test-Path $p)) { $missing += $p }
          }
          if ($missing.Count -gt 0) { Write-Host "packaging tools missing after cache+fetch: $($missing -join ', ')"; exit 1 }
          Write-Host '[tools] NSIS makensis.exe + WiX candle.exe both present'

      # 构建 + 签名（createUpdaterArtifacts=true 会产出 .sig）
      - name: Build & sign
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      # ① P1-2：产物名归一化 —— 空格改点，使「本地名 = GitHub 资产名 = latest.json url」一字不差。
      #    GitHub 对上传资产名的空格做规范化（空格→点），这是 0.14.0~0.14.4 下载 404 的根因。
      #    .sig 与产物同改（签名签的是字节，改名不影响配对）。
      - name: Normalize updater artifact names
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'src-tauri/target/release/bundle'
          $candidates = @()
          foreach ($pattern in @("$bundle/nsis/*.exe", "$bundle/nsis/*.exe.sig", "$bundle/msi/*.msi", "$bundle/msi/*.msi.sig")) {
            $candidates += @(Get-ChildItem $pattern -File -ErrorAction SilentlyContinue)
          }
          if ($candidates.Count -lt 4) {
            throw "expected >=4 bundle artifacts (nsis exe+sig, msi+sig), found $($candidates.Count)"
          }
          foreach ($f in $candidates) {
            if ($f.Name -match ' ') {
              $newName = $f.Name -replace ' ', '.'
              $target = Join-Path $f.DirectoryName $newName
              if (Test-Path $target) { throw "rename target already exists: $newName" }
              Rename-Item -LiteralPath $f.FullName -NewName $newName
              Write-Host "renamed: $($f.Name) -> $newName"
            }
          }
          # G5：两个 bundle 都必须无空格残留（否则 GitHub 会再次改名，url 又错位）
          $left = @(Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Name -match ' ' })
          if ($left.Count -gt 0) {
            throw "space-containing artifact names remain: $($left.Name -join ', ')"
          }
          Get-ChildItem $bundle -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      # ② 由**最终产物名**生成 latest.json（Gate 判据 3：不手写版本号/签名，全部从 tauri 产物读取）
      #    签名取安装包的 .sig（签的是安装包字节）；url 的 basename 必须与上传后的资产名一字不差。
      - name: Compose latest.json
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_NAME
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $conf.version
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File | Select-Object -First 1
          if (-not $nsis) { throw 'nsis setup.exe not found' }
          if ($nsis.Name -match ' ') { throw "artifact name still has a space: $($nsis.Name)" }
          $sig = "$($nsis.FullName).sig"
          if (-not (Test-Path $sig)) { throw "missing signature: $sig" }
          $platform = @{
            "windows-x86_64" = @{
              signature = (Get-Content $sig -Raw).Trim()
              url = "$env:SERVER_URL/$env:REPOSITORY/releases/download/$tag/$($nsis.Name)"
            }
          }
          # notes 取自 Release 正文文件（方案 A，裁定六十：文件只放用户可见正文，
          # 维护者操作说明另放 docs/发版操作-<tag>.md —— 人机混写会被截断推上用户弹窗）。
          # fail-closed（两态）：文件不存在 **或** 存在但内容纯空白 → 都回落泛化串，notes 永不为空。
          # 截断：先按 UTF-16 code unit 截 500，若劈开代理对回退 1 位（emoji 边界不产出孤立代理）。
          $notesFile = "docs/release-notes-$tag.md"
          $notes = "Release $tag"
          if (Test-Path $notesFile) {
            $body = (Get-Content $notesFile -Raw).Trim()
            if (-not [string]::IsNullOrWhiteSpace($body)) { $notes = $body }
          }
          # 0.14.11 卡：notes 进更新弹窗前剥 markdown 标记（弹窗 textContent 纯文本、不解析 HTML）。
          # 顺序锁死：剥 → 度量 $notes.Length（序列化前）→ 截 500 内最近「。」→ 序列化。
          # 剥：标题号 ^#{1,6}、反引号、** 粗体号；压连续空行。剥后纯空白 ⇒ 回落泛化串（fail-closed 不丢）。
          if ($notes -ne "Release $tag") {
            $notes = $notes -replace '(?m)^[ \t]*#{1,6}[ \t]*', ''
            $notes = $notes -replace '`', ''
            $notes = $notes -replace '\*\*', ''
            $notes = $notes -replace '(\r?\n){3,}', "`n`n"
            $notes = $notes.Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }
          }
          # 截断：先按 500 截（代理对回退 1 位），再退到 500 内最近的「。」（<200 退回硬切）。
          # 上限 501（含省略号）：LastIndexOf('。', $cut-1) 从 499 回扫、idx 可达 499 → cut=500 → Substring(0,500)+'…'＝501。
          # 两分支均加「…」（硬切与句号截断两种出口都留截断痕迹、1 字符成本；与 overflow:auto 滚动条并存，不冲突）。
          if ($notes.Length -gt 500) {
            $cut = 500
            if ([char]::IsHighSurrogate($notes[$cut - 1])) { $cut = $cut - 1 }
            $idx = $notes.LastIndexOf('。', $cut - 1)
            if ($idx -ge 200) { $cut = $idx + 1 }
            $notes = $notes.Substring(0, $cut) + '…'
          }
          $latest = @{ version = $version; notes = $notes; pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); platforms = $platform }
          ($latest | ConvertTo-Json -Depth 6) | Set-Content -Path "src-tauri/target/release/latest.json" -Encoding UTF8
          Get-Content "src-tauri/target/release/latest.json"

      # v0.14.12：draft 步前置断言——notes 文件必须存在且非空白。
      # action-gh-release@v2 对 body_path 缺文件只 warn 不 fail（函数 ap catch ENOENT → console.warn → 回退 body 空），
      # 我们从不设 body ⇒ Release body 静默空、CI 全绿。自家 throw 才能真正 fail-closed。
      - name: Verify notes file exists
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $f = "docs/release-notes-$env:TAG_NAME.md"
          if (-not (Test-Path $f)) { throw "notes file not found: $f" }
          $body = (Get-Content $f -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($body)) { throw "notes file is blank: $f" }
          Write-Host "notes file OK: $f ($($body.Length) chars)"

      # fail-safe：先建 **draft** Release（Gate 判据 4）
      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: docs/release-notes-${{ github.ref_name }}.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── v0.14.13 卡 F：发布正文显式覆盖（PATCH ＋ 回读等值）────────────────────────────
      # 取证（run 42468047633 job 128772059929 attempt=2 日志 L987-989 原文）：
      #   tag push 时 GitHub 已按 annotated tag 自动创建 release 对象（438207615，created_at＝tagger date
      #   逐秒一致），action 走"复用"路径——自建的带 body_path 的 draft（438330705）被它自己删除，
      #   body_path 的内容随之消失；v0.14.12 实测 body＝70 字＝tag message 前 69 字＋'…'（机制部分闭合、
      #   70 字来源未定，台账口径）。⇒ body_path 保留（供新建路径），此步显式 PATCH 兜底，回读逐字符
      #   等值才放行；不等即 throw（走 Delete draft on failure，fail-closed）。
      - name: Patch draft release body
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_NAME
          $repo = "$env:REPOSITORY"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'studio-release-gate'
          }
          # 查草稿必须走全量列表按 tag 过滤（GET /releases/tags/{tag} 不返回 draft——与 Preflight gate 同坑）
          $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases?per_page=100" |
            Where-Object { $_.tag_name -eq $tag -and $_.draft } | Select-Object -First 1
          if (-not $rel) { throw "draft release for tag $tag not found" }
          $expected = ((Get-Content "docs/release-notes-$tag.md" -Raw).Trim()) -replace "`r`n", "`n"
          $payload = @{ body = $expected } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -ContentType 'application/json; charset=utf-8' -Body $payload
          # 回读逐字符等值（卡 F 第 0 条硬判据）：不等即 throw，报错打三件套（两枚长度＋firstDiff 下标＋该位字符或 <end>）
          $rel2 = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases?per_page=100" |
            Where-Object { $_.tag_name -eq $tag -and $_.draft } | Select-Object -First 1
          $actual = ($rel2.body.Trim()) -replace "`r`n", "`n"
          if ($actual -ne $expected) {
            Write-Host "body mismatch: expected_len=$($expected.Length) actual_len=$($actual.Length)"
            $min = [Math]::Min($expected.Length, $actual.Length)
            $firstDiff = -1
            for ($i = 0; $i -lt $min; $i++) { if ($expected[$i] -cne $actual[$i]) { $firstDiff = $i; break } }
            if ($firstDiff -ge 0) { Write-Host "firstDiff=$firstDiff expected_char='$($expected[$firstDiff])' actual_char='$($actual[$firstDiff])'" }
            else { Write-Host "firstDiff=<end> (one side is a prefix of the other)" }
            throw "draft release body != notes file after PATCH"
          }
          Write-Host "draft body patched and verified: $($actual.Length) chars"

      # ③ G 闸（Gate 增补判据 G1/G2/G5）：**draft 建好之后**跑，只认 GitHub 上的实际结果。
      #    G1：资产名取自 Release assets API（实际上传名），不许用本地文件名自证；
      #        latest.json 的 url basename 解码后必须等于该资产名。
      #    G2：下载**已上传的资产字节**，用 latest.json 的 signature + tauri.conf.json 的 pubkey 校验
      #        —— 复刻客户端 verify_signature 的判定，拦「Secret 私钥与仓库 pubkey 不配对」这类
      #        「发版绿、用户必挂」的事故。签名对象是安装包字节（不是 latest.json）。
      #    G5：NSIS（latest.json 引用的那个）与 MSI 的「本地名=远端名」都要核。
      #    （G4 的公开 url 可达性要在 publish 之后才能真 HEAD，见 release-published.yml）
      - name: Preflight gate (G1/G2/G5)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 诊断通道：闸的任何失败都写 ::error:: 注解（公开 API 可读；job logs 需管理员令牌）
          trap {
            Write-Host "::error::[preflight-gate] $($_.Exception.Message)"
            break
          }
          $tag = $env:TAG_NAME
          $repo = "$env:REPOSITORY"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'studio-release-gate'
          }
          # 注意：GET /releases/tags/{tag} 不返回 draft（GitHub 已知行为，run#12 的 404 根因），
          # draft 必须走全量列表按 tag 过滤。
          $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases?per_page=100" |
            Where-Object { $_.tag_name -eq $tag -and $_.draft } | Select-Object -First 1
          if (-not $rel) { throw "draft release for tag $tag not found" }
          Write-Host "release id=$($rel.id) draft=$($rel.draft) assets=$($rel.assets.Count)"
          # v0.14.12：draft body 非空断言（fail-closed 落点＝本步失败走 Delete draft on failure，
          # 删的是草稿、公开链一根毛都没动；且在点 Publish 之前就报红）。
          if ([string]::IsNullOrWhiteSpace($rel.body)) { throw "draft release body is empty — body_path did not take effect" }
          Write-Host "draft body length=$($rel.body.Length)"
          # v0.14.13 卡 F：非空之外再验等值（PATCH 步同判据的双保险；本步失败同样走 Delete draft on failure）。
          # 旧非空断言保留（抓"完全空"灾难态），等值断言抓"70 字 tag 注释残留"这类部分态。
          $notesExpected = ((Get-Content "docs/release-notes-$tag.md" -Raw).Trim()) -replace "`r`n", "`n"
          $bodyActual = ($rel.body.Trim()) -replace "`r`n", "`n"
          if ($bodyActual -ne $notesExpected) {
            Write-Host "body mismatch: expected_len=$($notesExpected.Length) actual_len=$($bodyActual.Length)"
            $min = [Math]::Min($notesExpected.Length, $bodyActual.Length)
            $firstDiff = -1
            for ($i = 0; $i -lt $min; $i++) { if ($notesExpected[$i] -cne $bodyActual[$i]) { $firstDiff = $i; break } }
            if ($firstDiff -ge 0) { Write-Host "firstDiff=$firstDiff expected_char='$($notesExpected[$firstDiff])' actual_char='$($bodyActual[$firstDiff])'" }
            else { Write-Host "firstDiff=<end> (one side is a prefix of the other)" }
            throw "draft release body != notes file (preflight equality check)"
          }

          $latest = Get-Content 'src-tauri/target/release/latest.json' -Raw | ConvertFrom-Json
          $plat = $latest.platforms.'windows-x86_64'
          if (-not $plat.url -or -not $plat.signature) { throw 'latest.json missing url/signature for windows-x86_64' }

          # G1：url 的 basename（解码后）必须等于实际资产名
          $urlName = [uri]::UnescapeDataString(($plat.url -split '/')[-1])
          $names = @($rel.assets | ForEach-Object { $_.name })
          Write-Host "url basename=$urlName"
          Write-Host "remote assets: $($names -join ', ')"

          $nsis = (Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File | Select-Object -First 1).Name
          $msi = (Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File | Select-Object -First 1).Name
          if ($urlName -ne $nsis) { throw "latest.json url basename '$urlName' != uploaded nsis asset '$nsis'" }
          foreach ($expected in @($nsis, "$nsis.sig", $msi, "$msi.sig", 'latest.json')) {
            if ($names -notcontains $expected) { throw "release is missing uploaded asset: $expected" }
          }
          foreach ($n in $names) {
            if ($n -match ' ') { throw "uploaded asset name contains a space: '$n'" }
          }
          if ($latest.version -ne $tag.TrimStart('v')) { throw "latest.json version $($latest.version) != tag $tag" }

          # G2：下载**上传后的**资产字节，校验签名（draft 只能走 API，公开 download URL 对 draft 不生效）
          $asset = $rel.assets | Where-Object { $_.name -eq $urlName } | Select-Object -First 1
          $tmp = Join-Path $env:RUNNER_TEMP 'uploaded-setup.exe'
          Invoke-WebRequest -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
            'User-Agent' = 'studio-release-gate'
          } -Uri $asset.url -OutFile $tmp
          $uploadedSize = (Get-Item $tmp).Length
          $localSize = (Get-Item (Join-Path 'src-tauri/target/release/bundle/nsis' $nsis)).Length
          Write-Host "uploaded=$uploadedSize local=$localSize"
          if ($uploadedSize -ne $localSize) { throw "uploaded asset size $uploadedSize != local $localSize" }

          $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          node src-tauri/verify-sig.mjs --pubkey $conf.plugins.updater.pubkey --signature $plat.signature --file $tmp
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed (exit $LASTEXITCODE)" }
          Write-Host 'preflight gate PASS'

      # G3：闸失败必须删掉 draft（fail-closed），不留半成品；已公开的 Release 绝不删。
      # 查草稿必须走全量列表按 tag 过滤（GET /releases/tags/{tag} 不返回 draft——run#12 404 根因，
      # 与 Preflight gate 同坑）；只匹配 draft=true，已发布的 Release 天然不会命中，
      # 从构造上保证「绝不删已发布」。
      - name: Delete draft on failure (fail-closed)
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:TAG_NAME
          $repo = "$env:REPOSITORY"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'studio-release-gate'
          }
          $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases?per_page=100" |
            Where-Object { $_.tag_name -eq $tag -and $_.draft } | Select-Object -First 1
          if (-not $rel) {
            Write-Host "no draft release for $tag, nothing to clean"
            exit 0
          }
          Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
          Write-Host "deleted draft release $($rel.id) for $tag"
