# 发版后的公开链路闸（Gate 增补判据 G1/G4）
#
# 为什么单独一个 workflow：Gate 要求「校验 url 可达（302/200）+ 签名过关，不过 fail-closed」。
# 但 draft Release 的公开下载 URL 对未发布状态一律 404（GitHub 只允许带 token 走 assets API），
# 所以「公开 url 真能下」这件事只能等到 **Publish 之后**才测得准 —— 本 workflow 挂在
# `release: published` 上，测的就是**客户端真正会走的那条链路**：
#   releases/latest/download/latest.json  →  url  →  302  →  真包字节  →  签名校验
# 闸失败 → 把 Release 打回 draft（fail-closed，Latest 指针随之离开它），Tag 保留，修好可重发。
#
# 与 release.yml 的分工：
#   - release.yml（draft 阶段）：G1 资产名 / G2 上传字节签名 / G5 双产物名 —— 走 assets API；
#   - 本文件（published 阶段）：G4 公开 url 可达 + 公开包字节签名 —— 走用户真实链路。
name: Release published gate

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify-public-chain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify public update chain (G1/G4)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_HTML_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $tag = '${{ github.event.release.tag_name }}'
          # 版本号不依赖 tag_name（unbound release 的 tag_name 是合成名 untagged-…，第 112 件）：
          # 优先 release.name（step15 建草稿时由 github.ref_name＝真 git tag 写入），回退 github.ref_name
          $rawVersion = $env:RELEASE_NAME
          if (-not $rawVersion -or $rawVersion -like 'untagged-*') { $rawVersion = $env:REF_NAME }
          $version = $rawVersion.TrimStart('v')
          $latestUrl = "https://github.com/$repo/releases/latest/download/latest.json"
          $tagLatestUrl = "https://github.com/$repo/releases/download/$tag/latest.json"
          # 现场诊断（第 107 件）：tag_name 与 ref_name 两个都打，一眼分 ③A（结构性 404）/③B（API 现算字段）
          Write-Host "[pub-chain] diag: repo=$repo tag_name=$tag ref_name=$env:REF_NAME version=$version latest_url=$latestUrl tag_url=$tagLatestUrl"
          # 第 110 件验证面：commitish 三件进 ::notice::（匿名可读注解，一发定案"闸读 tag 提交还是分支尖端"）
          Write-Host "::notice::[pub-chain] commitish: github.ref=$env:GH_REF github.sha=$env:GH_SHA target_commitish=$env:TARGET_COMMITISH tag_name=$tag ref_name=$env:REF_NAME"
          # 第 112 件验证面：release 四件进 ::notice::（id/tag_name/target_commitish/html_url——按 tag 查 unbound release 必 404）
          # 第 112 件观测面：git 标签绑定三方并排（release 在/tag 在/绑没绑）——缺这行查了两小时
          $gitRef = $null
          try { $gitRef = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/tags/$tag" -Headers @{ 'User-Agent' = 'studio-release-gate' } -TimeoutSec 60 -ErrorAction SilentlyContinue } catch { $gitRef = $null }
          $gitRefState = if ($gitRef -and $gitRef.object.sha) { "hit sha=$($gitRef.object.sha)" } else { "miss" }
          Write-Host "::notice::[pub-chain] release context: id=$env:RELEASE_ID tag_name=$tag name=$env:RELEASE_NAME target_commitish=$env:TARGET_COMMITISH html_url=$env:RELEASE_HTML_URL git_ref_tags/$tag=$gitRefState"

          # 1) 取 latest.json：优先读**客户端实际用的** Latest 端点；若刚发布的不是 Latest，退回本 tag 的资产
          $manifestSource = $null
          $manifest = $null
          try {
            $manifest = Invoke-RestMethod -Uri $latestUrl -Headers @{ 'User-Agent' = 'studio-release-gate' } -TimeoutSec 60
            if ($manifest.version -eq $version) {
              $manifestSource = $latestUrl
            } else {
              Write-Warning "Latest endpoint announces $($manifest.version), not $version — checking this tag's manifest instead"
              $manifest = $null
            }
          } catch {
            Write-Warning "Latest endpoint not usable yet: $($_.Exception.Message)"
          }
          if (-not $manifest) {
            try {
              $manifest = Invoke-RestMethod -Uri $tagLatestUrl -Headers @{ 'User-Agent' = 'studio-release-gate' } -TimeoutSec 60
              $manifestSource = $tagLatestUrl
            } catch {
              $pcode = $null; if ($_.Exception.Response) { $pcode = [int]$_.Exception.Response.StatusCode }
              Write-Host "::error::[pub-chain] tag-asset latest.json fetch failed: url=$tagLatestUrl HTTP=$pcode msg=$($_.Exception.Message) tag_name=$tag ref_name=$env:REF_NAME"
              throw "tag-asset latest.json not reachable (HTTP=$pcode): $tagLatestUrl — $($_.Exception.Message)"
            }
          }
          Write-Host "manifest source=$manifestSource manifest_version=$($manifest.version) expected_version=$version release_name=$env:RELEASE_NAME tag_name=$tag ref_name=$env:REF_NAME"
          if ($manifest.version -ne $version) {
            Write-Host "::error::[pub-chain] manifest version mismatch: manifest.version=$($manifest.version) expected=$version release.tag_name=$tag release.name=$env:RELEASE_NAME github.ref_name=$env:REF_NAME release.id=$env:RELEASE_ID"
            throw "manifest version $($manifest.version) != expected $version (release.tag_name=$tag release.name=$env:RELEASE_NAME)"
          }

          $plat = $manifest.platforms.'windows-x86_64'
          if (-not $plat.url -or -not $plat.signature) {
            Write-Host "::error::[pub-chain] manifest missing url/signature: version=$($manifest.version) url=$($plat.url) signature=$($plat.signature) source=$manifestSource tag_name=$tag ref_name=$env:REF_NAME"
            throw "manifest missing url/signature for windows-x86_64 (version=$($manifest.version) source=$manifestSource)"
          }
          $url = $plat.url
          $urlName = [uri]::UnescapeDataString(($url -split '/')[-1])
          Write-Host "download url: $url"

          # 2) G1（发布后复核）：url basename 必须出现在该 Release 的实际资产里
          $relHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'studio-release-gate'
          }
          # 第 112 件：按 tag 查 unbound release 必 404——一律走 release.id 数据通道
          try {
            $rel = Invoke-RestMethod -Headers $relHeaders -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          } catch {
            $pcode = $null; if ($_.Exception.Response) { $pcode = [int]$_.Exception.Response.StatusCode }
            Write-Host "::error::[pub-chain] releases/{id} fetch failed: id=$env:RELEASE_ID HTTP=$pcode msg=$($_.Exception.Message) tag_name=$tag ref_name=$env:REF_NAME"
            throw "releases/{id} not reachable (HTTP=$pcode, id=$env:RELEASE_ID) — $($_.Exception.Message)"
          }
          $assetNames = @($rel.assets | ForEach-Object { $_.name })
          Write-Host "release state: draft=$($rel.draft) prerelease=$($rel.prerelease) id=$($rel.id) tag_name=$($rel.tag_name) body_len=$($rel.body.Length) assets=$($assetNames.Count) names=$($assetNames -join ', ')"
          # 第 112 件判据：release 必须绑在 git 标签上——tag_name == release.name（＝step15 建草稿时的真 git tag）、
          # html_url 形如 /releases/tag/vX.Y.Z；untagged-… ＝未绑定＝失败态
          # （今晚三发起红处在其上游的版本等值比对，绑定关系与红点的因果未证）
          $expectedTag = $env:RELEASE_NAME
          if (-not $expectedTag -or $expectedTag -like 'untagged-*') { $expectedTag = $env:REF_NAME }

          # ── 0.14.20 自愈（用户拍板 2026-11-12）───────────────────────────────────────
          # 现场：v0.14.20 草稿建时 tag_name=v0.14.20，点 Publish 后被 GitHub 绑成合成 tag
          # `untagged-59ce0733f11ad98a73b5`；而 v0.14.19 同构却成功 ⇒ 侧不可预测（release.yml L343
          # 注释「机制未证」），**断言拦不住**——旧实现只会 throw＋撤稿，等于白跑一轮。
          # 改为：先把 release 显式重绑回真 tag（PATCH tag_name），删掉那个 stray 合成 tag，再回读确认；
          # 修不好才走原来的 fail-closed 撤稿。
          # 为什么重绑是安全的：release 资产下载 URL 由 tag_name 决定，而 latest.json 里的 url 是
          # release.yml 用 github.ref_name（真 tag）拼的 ⇒ 重绑后两者重新对齐，资产字节一个不动。
          $unbound = (-not $expectedTag) -or ($rel.tag_name -ne $expectedTag) -or ($rel.html_url -notlike "*/releases/tag/$expectedTag")
          if ($unbound) {
            $strayTag = $rel.tag_name
            Write-Host "::warning::[pub-chain] release unbound: expected=$expectedTag actual_tag_name=$strayTag html_url=$($rel.html_url) id=$($rel.id) — attempting self-heal (rebind tag_name)"
            $healBody = @{ tag_name = $expectedTag } | ConvertTo-Json
            try {
              $healed = Invoke-RestMethod -Method Patch -Headers $relHeaders -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -ContentType 'application/json' -Body $healBody
            } catch {
              $hcode = $null; if ($_.Exception.Response) { $hcode = [int]$_.Exception.Response.StatusCode }
              Write-Host "::error::[pub-chain] release not bound to git tag: expected=$expectedTag actual_tag_name=$strayTag id=$($rel.id) — self-heal PATCH failed HTTP=$hcode msg=$($_.Exception.Message)"
              throw "release unbound and self-heal PATCH failed (HTTP=$hcode) — expected tag_name '$expectedTag' got '$strayTag'"
            }
            Write-Host "::notice::[pub-chain] self-heal PATCH ok: tag_name=$($healed.tag_name) html_url=$($healed.html_url)"
            # 删 stray 合成 tag（只删 untagged-* 形态，绝不碰真版本 tag）
            if ($strayTag -like 'untagged-*') {
              try {
                Invoke-RestMethod -Method Delete -Headers $relHeaders -Uri "https://api.github.com/repos/$repo/git/refs/tags/$strayTag"
                Write-Host "::notice::[pub-chain] self-heal: deleted stray tag $strayTag"
              } catch {
                $dcode = $null; if ($_.Exception.Response) { $dcode = [int]$_.Exception.Response.StatusCode }
                Write-Host "::warning::[pub-chain] self-heal: delete stray tag $strayTag failed HTTP=$dcode msg=$($_.Exception.Message)（不阻断，release 已重绑）"
              }
            }
            # 回读确认（GitHub 最终一致性，给 2s）
            Start-Sleep -Seconds 2
            $rel = Invoke-RestMethod -Headers $relHeaders -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
            $assetNames = @($rel.assets | ForEach-Object { $_.name })
            Write-Host "::notice::[pub-chain] self-heal verify: draft=$($rel.draft) tag_name=$($rel.tag_name) html_url=$($rel.html_url) assets=$($assetNames.Count)"
            if ($rel.tag_name -ne $expectedTag -or $rel.html_url -notlike "*/releases/tag/$expectedTag") {
              Write-Host "::error::[pub-chain] release not bound to git tag: expected=$expectedTag actual_tag_name=$($rel.tag_name) html_url=$($rel.html_url) id=$($rel.id) — self-heal attempt did not take"
              throw "release still unbound after self-heal — expected '$expectedTag' got '$($rel.tag_name)'"
            }
            Write-Host "release re-bound to $expectedTag by self-heal (id=$($rel.id))"
          } else {
            Write-Host "release bound to git tag $expectedTag (id=$($rel.id))"
          }
          if ($assetNames -notcontains $urlName) {
            Write-Host "::error::[pub-chain] manifest url asset not in release: expected='$urlName' actual=[$($assetNames -join ', ')] draft=$($rel.draft) tag_name=$tag ref_name=$env:REF_NAME"
            throw "manifest url asset '$urlName' not in release assets: $($assetNames -join ', ')"
          }
          if ($urlName -match ' ') {
            Write-Host "::error::[pub-chain] manifest url asset name contains a space: name='$urlName' tag_name=$tag ref_name=$env:REF_NAME"
            throw "manifest url asset name contains a space: '$urlName'"
          }

          # 2.5) G4-body 可见性（不杀伤）：body 空只 Write-Warning 不 throw——本 job 失败会触发
          #      Revert to draft，把已发布、验签全过的正式版撤下公开口（升级全员中断），
          #      与"页面上少一段说明"不成比例。真正的 fail-closed 断言在 release.yml 的 Preflight gate
          #      （失败走 Delete draft on failure，删的是草稿、公开链不受影响）。
          if ([string]::IsNullOrWhiteSpace($rel.body)) {
            Write-Warning "Release body is empty — body_path did not take effect (fail-closed assertion lives in release.yml Preflight gate)"
          }
          Write-Host "Release body length=$($rel.body.Length)"

          # 3) G4：公开 url 可达（302/200），带重试（GitHub 资产生效有延迟：3 次 × 10s）
          $reachable = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $resp = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -SkipHttpErrorCheck -TimeoutSec 60
              Write-Host "HEAD attempt $attempt -> $($resp.StatusCode)"
              if ($resp.StatusCode -in 200, 302) { $reachable = $true; break }
            } catch {
              Write-Host "HEAD attempt $attempt failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $reachable) {
            Write-Host "::error::[pub-chain] public download url not reachable after 3 attempts: url=$url urlName='$urlName' tag_name=$tag ref_name=$env:REF_NAME last_head=$($resp.StatusCode)"
            throw "public download url not reachable after 3 attempts: $url"
          }

          # 4) 下载真包字节（用户链路）并校验签名 —— 与客户端 verify_signature 同判据
          $tmp = Join-Path $env:RUNNER_TEMP 'public-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $tmp -Headers @{ 'User-Agent' = 'studio-release-gate' } -TimeoutSec 600
          $downloadedSize = (Get-Item $tmp).Length
          $asset = $rel.assets | Where-Object { $_.name -eq $urlName } | Select-Object -First 1
          Write-Host "downloaded=$downloadedSize asset.size=$($asset.size)"
          if ($downloadedSize -ne [int64]$asset.size) {
            Write-Host "::error::[pub-chain] downloaded size mismatch: downloaded=$downloadedSize asset_size=$($asset.size) urlName='$urlName' tag_name=$tag ref_name=$env:REF_NAME"
            throw "downloaded size $downloadedSize != release asset size $($asset.size) (truncated or wrong file)"
          }
          $pubkey = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).plugins.updater.pubkey
          node src-tauri/verify-sig.mjs --pubkey $pubkey --signature $plat.signature --file $tmp
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::[pub-chain] signature verification failed: exit=$LASTEXITCODE urlName='$urlName' sig_len=$($plat.signature.Length) tag_name=$tag ref_name=$env:REF_NAME"
            throw "signature verification failed for published artifact (exit $LASTEXITCODE)"
          }
          Write-Host 'published chain OK'

      # fail-closed：公开链路不通 → 打回 draft（Latest 指针随之离开它），Tag 保留，修好可重发。
      # 撤回动作自身可观测（第 107 件）：PATCH 前后各打状态，注解匿名可读——
      # 分不清"撤回了/没撤成"会让读数与事实互相矛盾。
      - name: Revert to draft on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $tag = '${{ github.event.release.tag_name }}'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'studio-release-gate'
          }
          # 第 112 件：按 tag 查 unbound release 必 404——一律走 release.id 数据通道
          try {
            $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          } catch {
            Write-Host "::error::[revert-to-draft] fetch release by id failed: id=$env:RELEASE_ID tag=$tag ref_name=$env:REF_NAME msg=$($_.Exception.Message) — cannot revert, release state unknown"
            throw
          }
          Write-Host "::error::[revert-to-draft] reverting: tag=$tag id=$($rel.id) draft_before=$($rel.draft) ref_name=$env:REF_NAME — public update chain failed its gate"
          $body = @{ draft = $true } | ConvertTo-Json
          try {
            Invoke-RestMethod -Method Patch -Headers $headers -Body $body -ContentType 'application/json' -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
          } catch {
            Write-Host "::error::[revert-to-draft] PATCH draft=true failed: id=$($rel.id) tag=$tag msg=$($_.Exception.Message) — release may still be PUBLIC"
            throw
          }
          $rel2 = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          Write-Host "::error::[revert-to-draft] reverted: tag=$tag id=$($rel.id) draft_after=$($rel2.draft)"
          exit 1
