name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx tsx tools/coverage/check.ts
      - run: npx tsx tools/audit/boundary.ts
      - run: npx tsx tools/audit/doc-drift.ts
      - run: npx tsx tools/audit/security.ts
      - run: npx tsx tools/e2e/runner.ts tools/e2e/fixtures/simple-task.json
