name: CI
on: [push, pull_request]

# 门禁接线（20261031）：CI 与本地 gate 合一——只跑 npm run gate，不再维护平行步骤清单，
# 步骤差异 = 0 由构造保证（清单唯一真相在 tools/gate/run.ts）。
# 注（20261114 修订）：GitHub runner 上 `upstream-drift`（信息级）读不到上游仓 → 显式 N/A
# 读数（本步不参与判定、exit 0），不再刷「锚点异常」；`host-freshness` 阻塞级闸在 gate 前
# 先跑 `npm run build:host` 现场产出跟踪产物——CI 从此真验「宿主 bundle 能否从源码产出」，
# 同时挡住装版时 beforeBuildCommand 现场构建炸掉那一类（d62c059 起连续 18 发 CI 红的根因：
# 判据把「产物不存在」当「陈旧」，本机永远有产物所以一直绿）。
#
# 20261105 CI 环境对齐：runner 从 ubuntu-latest 改 windows-latest——本仓测试本就是
# Windows 导向（E:/NAS 路径断言、Windows 进程行为、注册表/HKCU 交互）；
# Release 线已在 windows-latest 实战全绿（release.yml run#14）。CI 环境与本地环境的
# 差异面收窄到「未跟踪取证产物」（logs/、.studio-tmp/ 等已 gitignore），由 doc-drift
# 的豁免规则（tools/audit/doc-drift.ts）补齐。
jobs:
  gate:
    runs-on: windows-latest
    env:
      # ⑥ 甲案（20261115 PM 裁定）：bom-drift 的 CI 侧复判基线——推送前 sha；
      # 全零（新分支首推）由脚本回落 HEAD~1，无父提交时 scanned=0 步骤绿（语义内空）。
      # ⑥-补（群PM 判据）：基线对象必须真取到 ⇒ **fetch-depth: 0**（默认浅检出取不到
      # before 对象，GHOST 态会静默退回本机面＝恒 scanned=0 的伪绿）。射程：仅本 job——
      # cargo-check 与负控 job 不需要历史，维持浅检出。
      BOM_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # 20261114：host-freshness（阻塞级）需要跟踪产物可比对；先按单一真源
      # （tools/host-build-options.mjs，与本地 npm run build:host 同源）现场产出宿主 bundle。
      - run: npm run build:host
      # ④②c（20261115 PM 派卡）：夹具上游仓——上游强校验的「正判据分支」（isFile/isDir＋
      # 行号界内）此前在 CI 上一次都没判过（无 E:\NAS\deepseek-pp，绿的只是 N/A 那半）。
      # 生成脚本从 docs 现算引用集（自维护：docs 新增引用夹具自动跟上），env 指入后
      # doc-drift 的 58 处上游引用全部真判。红半由下方 doc-drift-upstream-negative job 持续自证。
      - name: make upstream fixture (④②c)
        run: npx tsx scripts/make-upstream-fixture.mts "$env:RUNNER_TEMP\fake-upstream"
      - name: point STUDIO_UPSTREAM_ROOT at fixture
        run: Add-Content $env:GITHUB_ENV "STUDIO_UPSTREAM_ROOT=$env:RUNNER_TEMP\fake-upstream"
      - run: npm run gate

  # ── ④②c 上游强校验负控（20261115）：坏夹具上判据必须红（exit 1）——红输出永久留档
  #    本 job 日志，红绿两半每发 push 都在 CI 历史里自证。job 断言成立才绿：job 红＝判据失效。
  doc-drift-upstream-negative:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: make broken upstream fixture
        run: npx tsx scripts/make-upstream-fixture.mts "$env:RUNNER_TEMP\broken-upstream" --broken
      - name: doc-drift must FAIL on broken fixture (红判据留档)
        run: |
          $env:STUDIO_UPSTREAM_ROOT = "$env:RUNNER_TEMP\broken-upstream"
          npx tsx tools/audit/doc-drift.ts *> "$env:RUNNER_TEMP\dd-out.txt"
          $code = $LASTEXITCODE
          $hit = Select-String -Path "$env:RUNNER_TEMP\dd-out.txt" -Pattern '上游引用第\s+\d+\s+行，但\s+\S+\s+最多只有'
          $hit | ForEach-Object { $_.Line }
          $checked = Select-String -Path "$env:RUNNER_TEMP\dd-out.txt" -Pattern '校验 (\d+) 处' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Select-Object -First 1
          # ⑤-0（20261115 PM 复核钉死）：真凶是 **Actions 为 pwsh 步骤自动生成的包装尾行**
          # `if ((Test-Path variable:/LASTEXITCODE)) { exit $LASTEXITCODE }`——pwsh -File 本身
          # 无显式 exit 时进程码是 0（PM 三探针实证），是尾行把故意失败的 doc-drift 的
          # $LASTEXITCODE=1 顶成了步骤红。三条断言逐条显式 exit 1，全过必须显式 exit 0
          # （显式 exit 使包装尾行不生效——修法不变，机制描述以探针为准）。
          if ($code -ne 1) { Write-Error "doc-drift 应红（exit 1）判坏夹具，实际 exit=$code"; exit 1 }
          if (-not $hit -or $hit.Count -lt 1) { Write-Error "红输出未命中越界文案——红必须红在『上游引用行号越界』这件事上，任何无关阻塞红不得顶替"; exit 1 }
          if (-not $checked -or $checked -le 0) { Write-Error "『校验 N 处』缺失或 N=0——红必须来自真判据分支，不是 checked=0 的空转"; exit 1 }
          Write-Host "✅ 负控成立：判据红（exit 1）＋越界文案命中 $($hit.Count) 处＋校验 N=$checked>0——红输出已留档本 job 日志"
          exit 0

  # ── Rust 编译闸（20261109 卡 #49）：CI 只证"Rust 代码在 @stable 上能编译"，不证"与本机
  #    rustc 1.99.1 同工具链"——台账与 job 名都带这句射程，别把 CI 绿读成"同工具链绿"。
  #    与 gate job 并列、互不阻塞、不塞进 npm run gate（gate 的 15–17 分钟基线与"配置一致性
  #    有闸、编译无闸"这条定字要保住）。首跑/二跑时长以 CI 实测为准、不采估算。
  #    改前事实缺口：本文件之外 cargo/rust 命中 0（即 CI 从不编译 Rust，K1 那 4 枚 Rust 文件的
  #    首次真编译在下一次 tag 的 release.yml）；本 job 即为补该缺口（20261109 卡 #49）。
  #    只 cargo check --tests（编译含 #[cfg(test)] 代码、不执行）；不跑 cargo test
  #    （td05 环境红会混淆 CI 收口）。
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # ── CI-H（20261109）：cargo check 会跑 src-tauri/build.rs，tauri-build 无条件复制
      #    bundle.resources 的每个源文件（tauri-build-2.7.1/src/lib.rs:745-763 copy_resources），
      #    缺一个就 Err 退出。resources map 里 5 枚是 gitignored 产物（host/main.mjs、node/node.exe、
      #    dist/agent-panel.js、dist/mcp-settings-panel.js、dist/consent-panel.js），CI 全新 checkout
      #    上必须先产出来——与 release.yml:L64-70 同形（那句原话「tauri CLI 校验 bundle.resources
      #    早于 beforeBuildCommand」release 面有、CI 面此前没人搬过来，这就是首跑 failure 的根因）。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build:inject（esbuild.inject.mjs）产 entry.js＋dist/{agent-panel,mcp-settings-panel,consent-panel}.js
      # build:host（esbuild.host.mjs）产 src-tauri/host/main.mjs
      - run: npm run build
      # fetch-node.mjs 拉 bundled node.exe 到 src-tauri/node/（release.yml:L69-70 同步）
      - run: node src-tauri/fetch-node.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo check --tests (@stable)
        working-directory: src-tauri
        run: cargo check --tests
